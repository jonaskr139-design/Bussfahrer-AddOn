    {q:'Wie viele Felder hat ein klassisches Schachbrett?',a:64,unit:'Felder',why:'8 Reihen mal 8 Spalten.'},
    {q:'Wie viele Herzen hat ein Oktopus?',a:3,unit:'Herzen',why:'Zwei Kiemenherzen und ein Körperherz.'},
    {q:'Wie viele Sekunden hat ein Tag?',a:86400,unit:'Sekunden',why:'24 × 60 × 60 = 86.400.'},
    {q:'Wie viele Bundesländer hat Deutschland?',a:16,unit:'Bundesländer',why:'Deutschland besteht aus 16 Bundesländern.'},
    {q:'Wie viele Karten hat ein Skatblatt?',a:32,unit:'Karten',why:'Vier Farben zu jeweils acht Karten.'},
    {q:'Wie viele Steine hat ein vollständiges Standard-Domino mit Doppel-Sechs?',a:28,unit:'Steine',why:'Alle ungeordneten Zahlenpaare von 0 bis 6.'},
    {q:'Wie viele Würfelaugen liegen auf den sechs Seiten eines üblichen Würfels insgesamt?',a:21,unit:'Augen',why:'1 + 2 + 3 + 4 + 5 + 6 = 21.'},
    {q:'Wie viele Grad hat die Winkelsumme eines Dreiecks in der Ebene?',a:180,unit:'Grad',why:'In der euklidischen Ebene sind es 180°.'},
    {q:'Wie viele Felder hat ein Sudoku mit 9 mal 9 Feldern?',a:81,unit:'Felder',why:'9 × 9 = 81.'},
    {q:'Wie viele Zähne hat ein typisches vollständiges Erwachsenengebiss inklusive Weisheitszähnen?',a:32,unit:'Zähne',why:'Je 16 Zähne im Ober- und Unterkiefer.'},
    {q:'Wie viele Spieler stehen bei zwei Fußballmannschaften regulär gleichzeitig auf dem Feld?',a:22,unit:'Spieler',why:'Elf pro Mannschaft.'},
    {q:'Wie viele Tasten hat ein übliches Konzertklavier?',a:88,unit:'Tasten',why:'52 weiße und 36 schwarze Tasten.'},
    {q:'Wie viele Nullen hat eine Billion im Deutschen?',a:12,unit:'Nullen',why:'Eine Billion = 1.000.000.000.000.'},
    {q:'Wie viele Planeten hat unser Sonnensystem nach aktueller Definition?',a:8,unit:'Planeten',why:'Pluto wird als Zwergplanet eingestuft.'},
    {q:'Wie viele Milliliter sind ein Liter?',a:1000,unit:'Milliliter',why:'Ein Liter entspricht 1.000 Millilitern.'},
    {q:'Wie viele schwarze Felder hat ein Schachbrett?',a:32,unit:'Felder',why:'Die Hälfte der 64 Felder ist dunkel.'},
    {q:'Wie viele Stunden hat eine Schaltjahr-Woche?',a:168,unit:'Stunden',why:'Jede Woche hat sieben Tage – auch im Schaltjahr.'},
    {q:'Wie viele unterschiedliche Ergebnisse können beim gleichzeitigen Wurf zweier gewöhnlicher Würfel auftreten (mit Reihenfolge)?',a:36,unit:'Ergebnisse',why:'6 × 6 geordnete Kombinationen.'},
    {q:'Wie viele Minuten sind 2,5 Stunden?',a:150,unit:'Minuten',why:'2,5 × 60 = 150.'},
    {q:'Wie viele Kontinente zählt das verbreitete Sieben-Kontinente-Modell?',a:7,unit:'Kontinente',why:'Europa, Asien, Afrika, Nordamerika, Südamerika, Australien/Ozeanien und Antarktika.'},
    {q:'Wie viele Seiten hat ein regelmäßiges Zwölfeck?',a:12,unit:'Seiten',why:'Der Name verrät die Zahl: zwölf.'},
    {q:'Wie viele Knochen hat das erwachsene menschliche Skelett üblicherweise?',a:206,unit:'Knochen',why:'Die Standardangabe ist 206; individuelle Abweichungen sind möglich.'},
    {q:'Wie viele Tage hat ein Schaltjahr?',a:366,unit:'Tage',why:'Der Februar hat dann 29 Tage.'}
  ];
  const ROW_SIZES = [5,4,3,2,1];
  const copy = x => JSON.parse(JSON.stringify(x));
  const pick = (arr,exclude=-1,rand=Math.random) => { let idx=Math.floor(rand()*arr.length); if(arr.length>1 && idx===exclude) idx=(idx+1)%arr.length; return idx; };
  const escapeHtml = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function createGame(names,settings={}) {
    const cleaned=names.map(x=>String(x).trim()).filter(Boolean);
    if(cleaned.length<2 || cleaned.length>12) throw Error('Bitte 2 bis 12 Personen eingeben.');
    if(new Set(cleaned.map(x=>x.toLocaleLowerCase('de'))).size!==cleaned.length) throw Error('Namen müssen eindeutig sein.');
    const deck=[32,52,104].includes(Number(settings.deck))?Number(settings.deck):52;
    if(cleaned.length*4+15>deck)throw Error(`Für ${cleaned.length} Personen werden mindestens ${cleaned.length*4+15} Karten benötigt. Bitte ein größeres Deck wählen.`);
    return {version:1,phase:'questions',players:cleaned.map((name,i)=>({id:i,name,remaining:4,correct:0,wrong:0,jokers:0,distributed:0})),settings:{deck,aceLow:!!settings.aceLow,events:['few','normal','many','off'].includes(settings.events)?settings.events:'normal',soft:settings.soft!==false,maxBus:settings.maxBus===0?0:Math.max(1,Math.min(30,Number(settings.maxBus)||10))},questionStep:0,questionDone:false,betList:[],choice:null,pyramidIndex:0,pyramidMatches:[],busDriver:null,busStep:0,busAttempts:1,estimateCount:0,lastEstimate:-1,lastEvent:-1,history:[],pendingEvent:false,pendingFinal:false};
  }
  function active(g){return g.players[g.questionStep%g.players.length]}
  function questionRound(g){return Math.floor(g.questionStep/g.players.length)}
  function resolveQuestion(g,correct){
    if(g.phase!=='questions'||g.questionDone)throw Error('Keine offene Kartenfrage.');
    let p=active(g), delta=[];
    (correct?p.correct++:p.wrong++);
    for(const bet of g.betList){const b=g.players.find(x=>x.id===bet.id);if(b&&bet.id!==p.id)delta.push({name:b.name,won:bet.guess===correct});}
    g.history.unshift(`${p.name}: ${correct?'richtig':'falsch'} · Runde ${questionRound(g)+1}`);
    g.betList=[];g.choice=null;g.questionDone=true;
    return delta;
  }
  function nextQuestion(g){
    if(g.phase!=='questions'||!g.questionDone)throw Error('Erst die Karte auflösen.');
    g.questionStep++;g.questionDone=false;
    if(g.questionStep===g.players.length*4)g.phase='pyramid';
  }
  function pyramidRow(index){let sum=0;for(let r=0;r<ROW_SIZES.length;r++){sum+=ROW_SIZES[r];if(index<sum)return r;}return 4;}
  function addPyramidMatch(g,id){
    if(g.phase!=='pyramid'||g.pyramidIndex>=15)throw Error('Nicht in der Pyramide.');
    const p=g.players.find(x=>x.id===id);
    if(!p||p.remaining<=0)throw Error('Keine Karten mehr übrig.');
    p.remaining--;p.distributed+=pyramidRow(g.pyramidIndex)+1;
    g.pyramidMatches.push(id);
  }
  function undoPyramidMatch(g){const id=g.pyramidMatches.pop();if(id===undefined)return;const p=g.players.find(x=>x.id===id);p.remaining++;p.distributed-=pyramidRow(g.pyramidIndex)+1;}
  function nextPyramid(g){if(g.phase!=='pyramid')throw Error('Nicht in der Pyramide.');g.pyramidIndex++;g.pyramidMatches=[];if(g.pyramidIndex>=15)g.phase='prebus';}
  function candidates(g){let max=Math.max(...g.players.map(p=>p.remaining));return g.players.filter(p=>p.remaining===max);}
  function startBus(g,id){if(g.phase!=='prebus')throw Error('Busfahrer noch nicht bereit.');if(!g.players.some(p=>p.id===id))throw Error('Person nicht gefunden.');g.busDriver=id;g.phase='bus';g.busStep=0;g.busAttempts=1;}
  function busAnswer(g,success,useJoker=false){
    if(g.phase!=='bus')throw Error('Nicht im Bus.');
    const p=g.players.find(x=>x.id===g.busDriver);
    if(success){g.busStep++;if(g.busStep>=5)g.phase='finished';return 'correct';}
    if(useJoker){if(p.jokers<=0)throw Error('Kein Joker verfügbar.');p.jokers--;g.busStep++;if(g.busStep>=5)g.phase='finished';return 'joker';}
    g.busStep=0;g.busAttempts++;
    if(g.settings.maxBus>0 && g.busAttempts>g.settings.maxBus)g.phase='finished';
    return 'reset';
  }
  function closest(answers,value){let valid=answers.filter(x=>Number.isFinite(x.value));if(!valid.length)return {closest:[],farthest:[]};let errors=valid.map(x=>Math.abs(x.value-value)),min=Math.min(...errors),max=Math.max(...errors);return {closest:valid.filter((x,i)=>errors[i]===min),farthest:valid.filter((x,i)=>errors[i]===max)};}
  return {QUESTIONS,EVENTS,ESTIMATES,ROW_SIZES,copy,pick,escapeHtml,createGame,active,questionRound,resolveQuestion,nextQuestion,pyramidRow,addPyramidMatch,undoPyramidMatch,nextPyramid,candidates,startBus,busAnswer,closest};
});

</script>
  <script>
/* Busfahrer Party Companion — no dependencies, no accounts, local-only state */
(()=>{
'use strict';
const G=window.BusGame, $=s=>document.querySelector(s), app=$('#app'), modal=$('#modalRoot'), E=G.escapeHtml;
const STORAGE='busfahrer-party-v1';
let game=null, setupNames=['','', ''], setupCfg={deck:52,events:'normal',soft:true,maxBus:10,aceLow:false};
let ui={screen:'game',modal:null,answers:{},revealed:false,currentEstimate:null,event:null,view:'main',result:null};
const icons={question:'✦',pyramid:'◆',bus:'↗'};
function load(){try{let raw=localStorage.getItem(STORAGE);if(raw){let obj=JSON.parse(raw);if(obj?.version===1&&Array.isArray(obj.players)&&obj.players.length>=2&&['questions','pyramid','prebus','bus','finished'].includes(obj.phase)){game=obj;}}}catch(e){console.warn('Speicherstand konnte nicht geladen werden.',e)}}
function save(){try{if(game)localStorage.setItem(STORAGE,JSON.stringify(game));else localStorage.removeItem(STORAGE)}catch(e){console.warn('Lokaler Speicher nicht verfügbar',e)}}
function toast(msg){let el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}
const btn=(label,act,cls='btn-primary',extra='')=>`<button class="btn ${cls}" data-action="${act}" ${extra}>${label}</button>`;
const format=x=>Number(x).toLocaleString('de-DE');
function header(eyebrow,title,sub){return `<section class="heading"><div class="eyebrow"><span class="spark">✳</span> ${eyebrow}</div><h1>${title}</h1><p>${sub}</p></section>`}
function progress(label,current,total){return `<div class="progress-head"><span>${label}</span><strong>${current} / ${total}</strong></div><div class="progress-track"><span style="width:${Math.min(100,Math.max(0,current/total*100))}%"></span></div>`}
function stages(){let p=game.phase,step=p==='questions'?0:p==='pyramid'?1:2;return `<nav class="steps" aria-label="Spielphasen">${['01 · FRAGEN','02 · PYRAMIDE','03 · BUS'].map((s,i)=>`<span class="step ${step===i?'active':''} ${step>i?'done':''}">${s}</span>`).join('')}</nav>`}
function playerChips(){return `<div class="players-strip">${game.players.map((p,i)=>`<span class="player-chip"><span class="avatar">${E(p.name.slice(0,1).toUpperCase())}</span>${E(p.name)} <em>${p.remaining}✦</em></span>`).join('')}</div>`}
function setup(){return `<div class="hero-visual"><div class="floating-card red">♥</div><div class="floating-card black">♠</div><div class="bus-circle">🚌</div><div class="hero-glow"></div></div>${header('DAS ADD-ON FÜR ECHTE KARTEN','DER NÄCHSTE HALT:<br><span class="gradient-text">CHAOS.</span>','Vier Fragen. Eine Pyramide. Ein Busfahrer. Dazu Wetten, verrückte Aktionen und Schätzduelle – alles auf einem Bildschirm.')}
  <div class="panel setup-panel"><div class="section-line"><h2>WER IST DABEI?</h2><span class="pill">2–12 PERSONEN</span></div><div id="nameList">${setupNames.map((name,i)=>`<label class="name-row"><span class="num">${String(i+1).padStart(2,'0')}</span><input maxlength="22" autocomplete="off" aria-label="Spieler ${i+1}" placeholder="Spieler ${i+1}" data-name="${i}" value="${E(name)}"><button class="remove-btn" data-action="remove-name" data-index="${i}" aria-label="Person entfernen" ${setupNames.length<=2?'disabled':''}>×</button></label>`).join('')}</div><button class="add-btn" data-action="add-name" ${setupNames.length>=12?'disabled':''}>＋ PERSON HINZUFÜGEN</button>
  <div class="section-line space-top"><h2>SPIELMODUS</h2><span class="pill">ANPASSBAR</span></div>
  <div class="settings-grid"><label class="field">Kartendeck<select id="deck"><option value="104" ${setupCfg.deck===104?'selected':''}>104 Karten (2 Decks)</option><option value="52" ${setupCfg.deck===52?'selected':''}>52 Karten</option><option value="32" ${setupCfg.deck===32?'selected':''}>32 Karten (Skat)</option></select></label><label class="field">Ereignisse<select id="events"><option value="few" ${setupCfg.events==='few'?'selected':''}>Wenige</option><option value="normal" ${setupCfg.events==='normal'?'selected':''}>Normal</option><option value="many" ${setupCfg.events==='many'?'selected':''}>Viele</option><option value="off" ${setupCfg.events==='off'?'selected':''}>Nur manuell</option></select></label><label class="field">Busfahrten-Limit<select id="maxBus">${[3,5,10,15,0].map(n=>`<option value="${n}" ${setupCfg.maxBus===n?'selected':''}>${n===0?'Ohne Limit':n+' Versuche'}</option>`).join('')}</select></label><label class="field">Ass-Wertung<select id="ace"><option value="high" ${!setupCfg.aceLow?'selected':''}>Ass hoch</option><option value="low" ${setupCfg.aceLow?'selected':''}>Ass niedrig</option></select></label></div>
  <label class="toggle-line"><input type="checkbox" id="soft" ${setupCfg.soft?'checked':''}><span>Entspannter Modus <small>Spielstrafen können jederzeit durch Aufgaben oder Wasser ersetzt werden.</small></span></label>
  ${btn('SPIEL STARTEN <span>→</span>','start','btn-primary big wide')}<p class="muted center small">Keine Anmeldung · Spielstand nur auf diesem Gerät · Keine echten Karten in der App</p></div>`}
function actionBar(){return `<div class="action-bar"><button data-action="event" class="action-tile"><span class="tile-icon coral">⚡</span><span><strong>EREIGNIS</strong><small>Spontane Aktion</small></span><span class="arrow">↗</span></button><button data-action="estimate" class="action-tile"><span class="tile-icon violet">≈</span><span><strong>SCHÄTZFRAGE</strong><small>Alle gegen alle</small></span><span class="arrow">↗</span></button></div>`}
function questions(){const r=G.questionRound(game),p=G.active(game),q=G.QUESTIONS[r],done=game.questionDone;
  return `${stages()}${header(`PHASE 01 · RUNDE ${r+1} VON 4`,'DIE VIER FRAGEN','Echte Karten ziehen. Vorher entscheiden, danach richtig oder falsch bestätigen.')}${progress('KARTENFRAGEN',game.questionStep+(done?1:0),game.players.length*4)}
  <div class="focus-card"><div class="card-top"><span class="tag">${done?'KARTE AUFGEDECKT':'AM ZUG'}</span><span class="small muted">${r+1}/4 · ${E(q.short)}</span></div><div class="person-icon">${E(p.name[0].toUpperCase())}</div><div class="overline">${E(p.name.toUpperCase())}</div><h2>${q.title}</h2><p>${q.hint}</p>${!done?`<div class="choice-grid">${q.choices.map((c,i)=>`<button data-action="choice" data-value="${i}" class="choice ${game.choice===i?'chosen':''}">${E(c)}</button>`).join('')}</div><div class="decision-line">${btn('✓ RICHTIG','correct','btn-success')}${btn('✕ FALSCH','wrong','btn-danger')}</div><p class="note">Erst die Ansage merken, dann echte Karte aufdecken und Ergebnis auswählen.</p>`:`<div class="success-note">${ui.result?.correct?'✓ Richtig! Vorteil verteilen.':'✕ Daneben! Spielstrafe nach euren Regeln.'}</div>${ui.result?.bets?.length?`<div class="bet-results">${ui.result.bets.map(b=>`<span>${E(b.name)}: ${b.won?'✓ Wette gewonnen':'✕ Wette verloren'}</span>`).join('')}</div>`:''}${btn('NÄCHSTE PERSON →','next-question','btn-primary wide')}`}</div>
  <div class="panel"><div class="section-line"><h3>🎯 WETTEN</h3><span class="pill">OPTIONAL</span></div><p class="muted">Vor dem Aufdecken können andere auf richtig oder falsch tippen. Gewinner verteilen eine Kleinigkeit, Verlierer übernehmen eine Aufgabe.</p>${!done?`<div class="bet-grid">${game.players.filter(x=>x.id!==p.id).map(b=>{let bet=game.betList.find(x=>x.id===b.id);return `<div class="bet-row"><span>${E(b.name)}</span><div><button class="bet ${bet?.guess===true?'selected':''}" data-action="bet" data-id="${b.id}" data-guess="true">✓</button><button class="bet ${bet?.guess===false?'selected':''}" data-action="bet" data-id="${b.id}" data-guess="false">✕</button></div></div>`}).join('')}</div>`:'<p class="muted">Wetten dieser Runde sind aufgelöst.</p>'}</div>${actionBar()}${playerChips()}`}
function pyramid(){let idx=game.pyramidIndex,row=G.pyramidRow(idx),rnum=row+1,rowstart=G.ROW_SIZES.slice(0,row).reduce((a,b)=>a+b,0),inRow=idx-rowstart+1;
return `${stages()}${header('PHASE 02 · KARTEN ABLEGEN','DIE PYRAMIDE','Legt die 15 Karten als 5–4–3–2–1 aus. Deckt sie von unten nach oben einzeln auf.')}${progress('PYRAMIDENKARTEN',idx,15)}
<div class="panel"><div class="pyramid-visual">${G.ROW_SIZES.slice().reverse().map((count,reversed)=>{let actual=4-reversed,offset=G.ROW_SIZES.slice(0,actual).reduce((a,b)=>a+b,0);return `<div class="pyr-row">${Array.from({length:count},(_,i)=>{let n=offset+i;return `<span class="pyr-card ${n<idx?'flipped':n===idx?'now':''}" title="Karte ${n+1}">${n<idx?'✓':n===idx?'?':'♠'}</span>`}).join('')}</div>`}).join('')}</div><div class="pyramid-key">AKTUELLE KARTE <strong>${idx+1}/15</strong> · REIHE <strong>${rnum}</strong> · <strong>${rnum} ${rnum===1?'PUNKT':'PUNKTE'}</strong> VERTEILEN</div></div>
<div class="focus-card smaller"><span class="tag">GLEICHER KARTENWERT?</span><h2>WER LEGT AB?</h2><p>Wer den gleichen Wert vor sich liegen hat, darf eine passende echte Karte ablegen. Jede abgelegte Karte zählt ${rnum} Verteilpunkt${rnum>1?'e':''}. Mehrfachablagen sind möglich.</p><div class="match-grid">${game.players.map(p=>`<button class="match-button" data-action="match" data-id="${p.id}" ${p.remaining<=0?'disabled':''}><strong>${E(p.name)}</strong><span>${p.remaining} übrig <b>＋</b></span></button>`).join('')}</div>${game.pyramidMatches.length?`<div class="inline-notice">Diese Karte: ${game.pyramidMatches.map(id=>E(game.players.find(p=>p.id===id).name)).join(', ')} <button data-action="undo-match">RÜCKGÄNGIG</button></div>`:''}${btn(idx===14?'ZUM BUSFAHREN →':'NÄCHSTE KARTE →','next-pyramid','btn-primary wide')}<p class="note">Bei Fehlbedienung „Rückgängig“ nutzen. Die App kennt die Werte der echten Karten nicht.</p></div>${actionBar()}${playerChips()}`}
function prebus(){let c=G.candidates(game);return `${stages()}${header('PHASE 03 · DAS FINALE','WER FÄHRT BUS?','Die Person mit den meisten übrigen Karten fährt. Bei Gleichstand entscheidet die höhere Kartensumme der echten Handkarten.')}
<div class="panel"><div class="section-line"><h2>RESTKARTEN</h2><span class="pill">BUS-TICKET</span></div><div class="scoreboard">${[...game.players].sort((a,b)=>b.remaining-a.remaining).map(p=>`<div class="score-line"><span>${E(p.name)}</span><strong>${p.remaining} <small>KARTEN</small></strong></div>`).join('')}</div><p class="muted small">${c.length===1?`${E(c[0].name)} hat die meisten Karten und ist als Busfahrer vorgeschlagen.`:'Gleichstand! Vergleicht die Kartenwerte mit euren echten Karten und wählt die richtige Person.'}</p></div>
<div class="focus-card smaller"><span class="tag">BUSFAHRER BESTIMMEN</span><label class="field">Wer muss fahren?<select id="driverSelect">${game.players.map(p=>`<option value="${p.id}" ${p.id===c[0].id?'selected':''}>${E(p.name)} (${p.remaining} Karten)</option>`).join('')}</select></label>${btn('SCHÄTZDUELL UM EINEN JOKER','duel','btn-secondary wide')}${btn('BUSFAHRT STARTEN →','start-bus','btn-primary wide')}<p class="note">Das Schätzduell ist optional. Der Gewinner erhält einen Joker; der Fahrer bleibt unverändert.</p></div>${actionBar()}`}
function bus(){let driver=game.players.find(p=>p.id===game.busDriver),start=game.busStep===0;return `${stages()}${header('PHASE 03 · ENDSTATION','DER BUS FÄHRT','Eine Startkarte aufdecken. Danach bei fünf weiteren echten Karten jeweils „höher oder tiefer“ ansagen.')}${progress('RICHTIGE ANSAGEN',game.busStep,5)}
<div class="focus-card"><div class="card-top"><span class="tag">🚌 BUSFAHRER</span><span class="pill">VERSUCH ${game.busAttempts}${game.settings.maxBus?' / '+game.settings.maxBus:''}</span></div><div class="person-icon">${E(driver.name[0].toUpperCase())}</div><div class="overline">${E(driver.name.toUpperCase())}</div><h2>${start?'STARTKARTE AUFDECKEN':'HÖHER ODER TIEFER?'}</h2><p>${start?'Lege eine neue Startkarte offen hin. Dann sage bei der nächsten Karte höher oder tiefer an.':'Die nächste Karte mit der vorherigen vergleichen. Gleich ist falsch.'}</p><div class="bus-progress">${Array.from({length:5},(_,i)=>`<span class="${i<game.busStep?'cleared':''}">${i<game.busStep?'✓':i+1}</span>`).join('')}</div><div class="decision-line">${btn('✓ RICHTIG','bus-correct','btn-success')}${btn('✕ FALSCH','bus-wrong','btn-danger')}</div>${driver.jokers?`<div class="joker-box">🃏 ${driver.jokers} Joker verfügbar · Nach einer falschen Ansage kann der Joker die Etappe retten.</div>`:''}<p class="note">Bei falsch startet die Reihe mit neuen Karten. Das Spiel erfasst nur die Ergebnisse, keine Kartenwerte.</p></div>${actionBar()}<p class="small muted center">Für Unentschieden und Sonderfälle gelten eure Hausregeln.</p>`}
function finished(){let driver=game.players.find(p=>p.id===game.busDriver);return `<div class="finish-hero"><div class="finish-emoji">🏁 🚌</div>${header('ALLE AUSSTEIGEN!','ENDSTATION<br><span class="gradient-text">ERREICHT.</span>',`${E(driver?.name||'Der Busfahrer')} hat die Fahrt beendet. Zeit für eine neue Runde?`)}</div><div class="panel"><div class="section-line"><h2>RUNDENSTATS</h2><span class="pill">FINALE</span></div><div class="stat-row"><span>Bus-Versuche</span><strong>${game.busAttempts}</strong></div><div class="stat-row"><span>Aufgedeckte Pyramidenkarten</span><strong>15</strong></div><div class="stat-row"><span>Richtige Kartenansagen</span><strong>${game.players.reduce((a,p)=>a+p.correct,0)}</strong></div>${game.players.map(p=>`<div class="stat-row"><span>${E(p.name)} · richtig / falsch</span><strong>${p.correct} / ${p.wrong}</strong></div>`).join('')}${btn('NEUE RUNDE →','new-game','btn-primary wide')}</div>`}
function render(){app.innerHTML=(!game||ui.screen==='setup')?setup():game.phase==='questions'?questions():game.phase==='pyramid'?pyramid():game.phase==='prebus'?prebus():game.phase==='bus'?bus():finished();renderModal();}
function renderModal(){if(!ui.modal){modal.innerHTML='';document.body.classList.remove('modal-open');return;}document.body.classList.add('modal-open');let m=ui.modal,body='';
if(m==='event'){let e=G.EVENTS[ui.event];body=`<span class="tag">⚡ ${e.tag}</span><h2>${E(e.title)}</h2><p class="modal-main">${E(e.text)}</p><p class="muted small">Die Aktionen sind optional. Ihr könnt jederzeit eine neue ziehen.</p><div class="modal-actions">${btn('ANDERE AKTION ↻','reroll-event','btn-secondary')}${btn('WEITER →','close-modal','btn-primary')}</div>`;}
if(m==='estimate'||m==='duel'){let q=G.ESTIMATES[ui.currentEstimate];let duel=m==='duel';body=`<span class="tag">${duel?'🏆 BUS-DUELL':'≈ SCHÄTZRUNDE'}</span><h2>${duel?'JOKER-JAGD':'WAS SCHÄTZT IHR?'}</h2><p class="modal-main">${E(q.q)}</p><div class="estimate-entries">${(duel?game.players.filter(p=>p.id===Number(ui.duelDriver)||p.id===Number(ui.challenger)):game.players).map(p=>`<label class="estimate-entry"><span>${E(p.name)}</span><input type="number" step="any" inputmode="decimal" data-estimate="${p.id}" ${ui.revealed?'disabled':''} value="${ui.answers[p.id]??''}" placeholder="Deine Schätzung"></label>`).join('')}</div>${!ui.revealed?`<div class="modal-actions">${btn('AUFLÖSEN →','reveal-estimate','btn-primary wide')}</div>`:`<div class="answer-box"><small>RICHTIGE ANTWORT</small><strong>${format(q.a)} ${E(q.unit)}</strong><p>${E(q.why)}</p></div>${estimateWinner()}<div class="modal-actions">${btn('FERTIG →','finish-estimate','btn-primary wide')}</div>`}`;}
if(m==='duel-select'){body=`<span class="tag">🏆 BONUS-SPIEL</span><h2>JOKER-DUELL</h2><p class="modal-main">Der geplante Busfahrer tritt gegen eine andere Person an. Wer näher an der richtigen Zahl liegt, bekommt einen Joker.</p><label class="field">Herausforderer<select id="challenger">${game.players.filter(p=>p.id!==Number(ui.duelDriver)).map(p=>`<option value="${p.id}">${E(p.name)}</option>`).join('')}</select></label><div class="modal-actions">${btn('DUELL STARTEN →','begin-duel','btn-primary wide')}</div>`;}
if(m==='bus-fail'){let driver=game.players.find(p=>p.id===game.busDriver);body=`<span class="tag">✕ FALSCHE ANSAGE</span><h2>VOLL BREMSEN!</h2><p class="modal-main">${E(driver.name)} lag daneben. Ohne Joker beginnt die Reihe mit neuen Karten von vorne.</p><div class="modal-actions">${driver.jokers?btn(`🃏 JOKER NUTZEN (${driver.jokers})`,'use-joker','btn-secondary'):''}${btn('NEUSTART ↻','bus-reset','btn-primary')}</div>`;}
if(m==='rules'){body=`<span class="tag">SPIELANLEITUNG</span><h2>SO FUNKTIONIERT'S</h2><div class="rules-text"><h3>1 · Vier Fragen</h3><p>Reihum tippen: rot/schwarz, höher/tiefer, innerhalb/außerhalb, Herz/Karo/Pik/Kreuz. Richtige Ansage: Vorteil verteilen. Falsche Ansage: kleine Spielstrafe. Gleiche Karten zählen bei den Vergleichsfragen als falsch. Die App speichert nur richtig/falsch – die Karten bleiben echt.</p><h3>2 · Pyramide</h3><p>15 Karten in 5–4–3–2–1 auslegen. Unten beginnen: 1 bis 5 Verteilpunkte pro Treffer. Passende Werte ablegen und in der App bestätigen. Optional könnt ihr selbst Bluffregeln ergänzen.</p><h3>3 · Busfahren</h3><p>Die meisten Restkarten bestimmen den Busfahrer; Gleichstand über die Summe der echten Karten. Eine Startkarte aufdecken, dann fünfmal höher/tiefer ansagen. Fehler: neuer Versuch, sofern kein Joker hilft. Ein festgelegtes Versuchslimit beendet die Fahrt automatisch.</p><h3>Extras</h3><p>Ereignisse und Schätzfragen sind optionale Einlagen. Bei Wetten tippen Mitspieler vor dem Aufdecken auf richtig/falsch. Im Schätzduell vor dem Bus gibt es einen Joker zu gewinnen.</p><p>Alle Spielstrafen sind frei gestaltbar: alkoholfreie Getränke, Wasser, Aufgaben oder Punkte funktionieren genauso.</p></div>${btn('VERSTANDEN','close-modal','btn-primary wide')}`;}
if(m==='settings'){body=`<span class="tag">SPIELVERWALTUNG</span><h2>PAUSENSTOPP</h2><p class="modal-main">Der Spielstand wird auf diesem Gerät automatisch gespeichert. Ein neues Spiel setzt alle Punkte und Kartenstände zurück.</p>${btn('REGELN ANZEIGEN','rules','btn-secondary wide')}${btn('NEUES SPIEL','new-game','btn-danger wide')}${btn('ZURÜCK','close-modal','btn-primary wide')}`;}
modal.innerHTML=`<div class="modal-backdrop" data-action="close-modal"><section class="modal-card" role="dialog" aria-modal="true" aria-label="${E(m)}"><button class="modal-close" data-action="close-modal" aria-label="Schließen">×</button>${body}</section></div>`;
}
function estimateWinner(){let entries=Object.entries(ui.answers).filter(([id,v])=>v!==''&&Number.isFinite(Number(v))).map(([id,v])=>({id:Number(id),value:Number(v),name:game.players.find(p=>p.id===Number(id))?.name||'?'}));let res=G.closest(entries,G.ESTIMATES[ui.currentEstimate].a);ui.winners=res.closest.map(x=>x.id);return `<div class="estimate-result"><p><strong>🎯 Am nächsten:</strong> ${res.closest.length?res.closest.map(p=>E(p.name)).join(', '):'Keine gültigen Tipps'}</p><p><strong>Am weitesten:</strong> ${res.farthest.length?res.farthest.map(p=>E(p.name)).join(', '):'—'}</p><p class="muted small">Bei Gleichstand teilen sich die Betroffenen den Platz. Gewinner dürfen eine kleine Aufgabe vergeben.</p></div>`;}
function store(){save();render()}
function maybeEvent(){let n=game.settings.events==='many'?2:game.settings.events==='few'?6:game.settings.events==='normal'?4:0;if(n&&game.questionStep>0&&game.questionStep%(n)===0&&game.phase==='questions'){startEvent();return true;}return false;}
function startEvent(){ui.event=G.pick(G.EVENTS,game?.lastEvent??-1);if(game)game.lastEvent=ui.event;ui.modal='event';renderModal();}
function startEstimate(mode='estimate'){if(!game)return;ui.currentEstimate=G.pick(G.ESTIMATES,game.lastEstimate);game.lastEstimate=ui.currentEstimate;game.estimateCount++;ui.answers={};ui.revealed=false;ui.winners=[];ui.modal=mode;store();}
function inputSettings(){setupCfg.deck=Number($('#deck')?.value)||52;setupCfg.events=$('#events')?.value||'normal';setupCfg.maxBus=Number($('#maxBus')?.value);setupCfg.aceLow=$('#ace')?.value==='low';setupCfg.soft=!!$('#soft')?.checked;}
function openSetup(){if(game&&!confirm('Aktuelle Runde beenden und neue starten?'))return;game=null;save();ui.screen='setup';ui.modal=null;ui.result=null;render();}
function handle(act,el){try{switch(act){
case 'add-name': if(setupNames.length<12){setupNames.push('');render()}break;
case 'remove-name':if(setupNames.length>2){setupNames.splice(Number(el.dataset.index),1);render()}break;
case 'start': {inputSettings();let names=[...document.querySelectorAll('[data-name]')].map(x=>x.value);game=G.createGame(names,setupCfg);ui.screen='game';ui.result=null;store();break;}
case 'choice':game.choice=Number(el.dataset.value);store();break;
case 'bet':{let id=Number(el.dataset.id),guess=el.dataset.guess==='true',current=game.betList.findIndex(x=>x.id===id);if(current>=0&&game.betList[current].guess===guess)game.betList.splice(current,1);else if(current>=0)game.betList[current]={id,guess};else game.betList.push({id,guess});store();break;}
case 'correct':case 'wrong':{if(game.choice===null){toast('Erst eine Ansage auswählen.');break;}let correct=act==='correct',bets=G.resolveQuestion(game,correct);ui.result={correct,bets};store();break;}
case 'next-question':G.nextQuestion(game);ui.result=null;store();maybeEvent();break;
case 'match':G.addPyramidMatch(game,Number(el.dataset.id));store();break;
case 'undo-match':G.undoPyramidMatch(game);store();break;
case 'next-pyramid':G.nextPyramid(game);store();break;
case 'start-bus':G.startBus(game,Number($('#driverSelect').value));store();break;
case 'bus-correct':G.busAnswer(game,true);store();break;
case 'bus-wrong':ui.modal='bus-fail';renderModal();break;
case 'bus-reset':G.busAnswer(game,false);ui.modal=null;store();break;
case 'use-joker':G.busAnswer(game,false,true);ui.modal=null;store();break;
case 'event':startEvent();break;
case 'reroll-event':startEvent();break;
case 'estimate':startEstimate();break;
case 'duel':ui.duelDriver=$('#driverSelect')?.value??G.candidates(game)[0].id;ui.modal='duel-select';renderModal();break;
case 'begin-duel':ui.challenger=$('#challenger').value;startEstimate('duel');break;
case 'reveal-estimate':{let activeInputs=[...modal.querySelectorAll('[data-estimate]')];ui.answers={};for(let x of activeInputs){if(x.value.trim()!==''){let val=Number(x.value);if(!Number.isFinite(val)||val<0){toast('Bitte gültige, nicht negative Zahlen eingeben.');return;}ui.answers[x.dataset.estimate]=val;}}if(Object.keys(ui.answers).length<(ui.modal==='duel'?2:1)){toast('Bitte erst alle benötigten Schätzungen eingeben.');return;}ui.revealed=true;renderModal();break;}
case 'finish-estimate':{if(ui.modal==='duel'&&ui.winners?.length===1){let p=game.players.find(p=>p.id===ui.winners[0]);if(p){p.jokers++;toast(`${p.name} hat einen Joker gewonnen!`)}}else if(ui.modal==='duel'&&ui.winners?.length>1){toast('Gleichstand! Diesmal gibt es keinen Joker.');}ui.modal=null;store();break;}
case 'close-modal':ui.modal=null;renderModal();break;
case 'rules':ui.modal='rules';renderModal();break;
case 'settings':ui.modal='settings';renderModal();break;
case 'new-game':openSetup();break;
}}catch(e){console.error(e);toast(e.message||'Etwas ist schiefgelaufen.');}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(el){if(el.classList.contains('modal-backdrop')&&e.target!==el)return;handle(el.dataset.action,el);}});
document.addEventListener('input',e=>{if(e.target.matches('[data-name]'))setupNames[Number(e.target.dataset.name)]=e.target.value;});
document.addEventListener('change',e=>{if(e.target.matches('#deck,#events,#maxBus,#ace,#soft'))inputSettings();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;renderModal()}});
$('#rulesBtn').addEventListener('click',()=>handle('rules'));
$('#settingsBtn').addEventListener('click',()=>handle('settings'));
$('#homeBtn').addEventListener('click',()=>{if(game){toast('Dein Spiel läuft bereits – hier ist die Übersicht.')}else render()});
load();render();
})();

</script>
</body>
</html>
